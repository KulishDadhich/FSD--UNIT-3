name: Release containers
on:
  workflow_run:
    workflows: [Continuous integration]
    types: [completed]
concurrency:
  group: eventflow-release
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase registry path
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ env.IMAGE_BASE }}-${{ matrix.component }}:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Canary rollout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/eventflow && git fetch origin && git checkout $COMMIT && cd deploy && set -a && . ./.env && set +a && export CANDIDATE_TAG=$COMMIT && bash rollout.sh"
